  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          self.addEventListener('install', (e) => { self.skipWaiting(); });
          self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
          self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request).catch(() => caches.match(e.request))); });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(err => console.log('SW offline ready'));
      });
    }
  </script>

    function App() {
      // ESTADOS PRINCIPAIS
      const [appMode, setAppMode] = useState("player");
      const [devPassword, setDevPassword] = useState(() => safeStorage.getItem("ruleMaster_dev_password") || "0000");
      const [isDevAuthenticated, setIsDevAuthenticated] = useState(false);
      const [showPasswordModal, setShowPasswordModal] = useState(false);
      const [enteredPassword, setEnteredPassword] = useState("");
      const [passwordError, setPasswordError] = useState("");

      const [appConfig, setAppConfig] = useState(() => {
        const saved = safeStorage.getItem("ruleMaster_config");
        return saved ? JSON.parse(saved) : DEFAULT_CONFIG;
      });

      const [games, setGames] = useState(() => {
        const saved = safeStorage.getItem("ruleMaster_games");
        return saved ? JSON.parse(saved) : BUILTIN_GAMES;
      });

      const [selectedGameKey, setSelectedGameKey] = useState("wonders_7");
      const selectedGame = games[selectedGameKey] || Object.values(games)[0] || BUILTIN_GAMES.wonders_7;

      // NAVEGAÇÃO
      const [playerTab, setPlayerTab] = useState("overview");
      const [devTab, setDevTab] = useState("add_game_manual");
      const [playerSearchQuery, setPlayerSearchQuery] = useState("");

      // FORMULÁRIO DE CADASTRO MANUAL
      const [manualForm, setManualForm] = useState({
        name: "", category: "Tabuleiro", icon: "🎲", players: "2-4 Jogadores",
        duration: "30 min", difficulty: "Médio", color: "from-purple-600 to-indigo-700",
        objective: "", victoryCondition: "", setupText: "", turnText: "", cheatText: "", ragManualText: ""
      });

      // CHAT JUIZ & VOZ
      const [chatMessages, setChatMessages] = useState([
        { role: "assistant", text: "Olá! Sou o Juiz Virtual da Mesa. Qual a sua dúvida sobre as regras do jogo atual?" }
      ]);
      const [inputMessage, setInputMessage] = useState("");
      const [isAiThinking, setIsAiThinking] = useState(false);
      const [isListening, setIsListening] = useState(false);
      const [isVoiceEnabled, setIsVoiceEnabled] = useState(true);
      const chatEndRef = useRef(null);

      // EDITOR DEV
      const [editingGameKey, setEditingGameKey] = useState("wonders_7");
      const editingGame = games[editingGameKey] || selectedGame;

      // MODAL DELEÇÃO
      const [deleteModalGameKey, setDeleteModalGameKey] = useState(null);

      // NOVO VÍDEO
      const [newVideoTitle, setNewVideoTitle] = useState("");
      const [newVideoUrl, setNewVideoUrl] = useState("");

      // NOTIFICAÇÃO TOAST
      const [toastMsg, setToastMsg] = useState("");
      const showNotification = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(""), 3500);
      };

      useEffect(() => { safeStorage.setItem("ruleMaster_config", JSON.stringify(appConfig)); }, [appConfig]);
      useEffect(() => { safeStorage.setItem("ruleMaster_games", JSON.stringify(games)); }, [games]);
      useEffect(() => { safeStorage.setItem("ruleMaster_dev_password", devPassword); }, [devPassword]);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [chatMessages, isAiThinking]);

      // VOZ (SINTETIZADOR & RECONHECIMENTO NATIVO)
      const speakText = (text) => {
        if (!isVoiceEnabled || !('speechSynthesis' in window)) return;
        try {
          window.speechSynthesis.cancel();
          const cleanText = text.replace(/[*#_~`]/g, '');
          const utterance = new SpeechSynthesisUtterance(cleanText);
          utterance.lang = 'pt-BR';
          utterance.rate = 1.05;
          window.speechSynthesis.speak(utterance);
        } catch (e) {}
      };

      const startListening = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          showNotification("Ditado por voz não suportado neste navegador.");
          return;
        }
        try {
          const recognition = new SpeechRecognition();
          recognition.lang = 'pt-BR';
          recognition.onstart = () => setIsListening(true);
          recognition.onresult = (e) => {
            setInputMessage(e.results[0][0].transcript);
            setIsListening(false);
          };
          recognition.onerror = () => setIsListening(false);
          recognition.onend = () => setIsListening(false);
          recognition.start();
        } catch (err) {
          setIsListening(false);
        }
      };

      // CADASTRO MANUAL DE NOVO JOGO
      const handleCreateManualGame = (e) => {
        e.preventDefault();
        if (!manualForm.name.trim()) return;

        const newKey = `game_${Date.now()}`;
        const newRecord = {
          id: newKey,
          name: manualForm.name.trim(),
          category: manualForm.category || "Tabuleiro",
          icon: manualForm.icon || "🎲",
          players: manualForm.players || "2-4 Jogadores",
          duration: manualForm.duration || "30 min",
          difficulty: manualForm.difficulty || "Médio",
          color: manualForm.color || "from-purple-600 to-indigo-700",
          isPublished: true,
          objective: manualForm.objective || "Objetivo do jogo.",
          victoryCondition: manualForm.victoryCondition || "Como vencer a partida.",
          setup: manualForm.setupText ? manualForm.setupText.split("\n").filter(Boolean) : ["Preparação básica."],
          turnStructure: manualForm.turnText ? manualForm.turnText.split("\n").filter(Boolean) : ["Executar ações do turno."],
          quickCheatSheet: manualForm.cheatText ? manualForm.cheatText.split("\n").filter(Boolean) : ["Regra rápida."],
          houseRules: [],
          faqs: [],
          youtubeVideos: [],
          ragManualText: manualForm.ragManualText || `Manual do jogo ${manualForm.name}.`
        };

        const updated = { ...games, [newKey]: newRecord };
        setGames(updated);
        setSelectedGameKey(newKey);
        setEditingGameKey(newKey);

        setManualForm({
          name: "", category: "Tabuleiro", icon: "🎲", players: "2-4 Jogadores",
          duration: "30 min", difficulty: "Médio", color: "from-purple-600 to-indigo-700",
          objective: "", victoryCondition: "", setupText: "", turnText: "", cheatText: "", ragManualText: ""
        });

        showNotification(`🎉 Jogo "${newRecord.name}" adicionado com sucesso!`);
      };

      // RESPOSTA DO JUIZ VIRTUAL
      const handleSendMessage = async (e) => {
        e.preventDefault();
        if (!inputMessage.trim() || isAiThinking) return;

        const userQuery = inputMessage;
        setInputMessage("");
        const newHistory = [...chatMessages, { role: "user", text: userQuery }];
        setChatMessages(newHistory);
        setIsAiThinking(true);

        setTimeout(() => {
          let replyText = "";
          const queryLower = userQuery.toLowerCase();
          
          if (queryLower.includes("vencer") || queryLower.includes("vitoria") || queryLower.includes("pontos")) {
            replyText = `Para vencer em **${selectedGame.name}**: ${selectedGame.victoryCondition}`;
          } else if (queryLower.includes("setup") || queryLower.includes("prepara") || queryLower.includes("iniciar")) {
            replyText = `Preparação de **${selectedGame.name}**: ${selectedGame.setup ? selectedGame.setup.join(" ") : "Siga as instruções padrão."}`;
          } else {
            replyText = `Consulta sobre **${selectedGame.name}**: Conforme o manual oficial, ${selectedGame.objective} Recomendo verificar os lembretes rápidos da aba 'Visão Geral'.`;
          }

          setChatMessages(prev => [...prev, { role: "assistant", text: replyText }]);
          speakText(replyText);
          setIsAiThinking(false);
        }, 600);
      };

      // VÍDEOS YOUTUBE
      const handleAddVideo = () => {
        if (!newVideoUrl.trim()) return;
        let vidId = newVideoUrl.trim();
        if (vidId.includes("youtu.be/")) vidId = vidId.split("youtu.be/")[1].split("?")[0];
        else if (vidId.includes("v=")) vidId = vidId.split("v=")[1].split("&")[0];

        const currentVids = editingGame.youtubeVideos || [];
        const updatedVids = [...currentVids, { id: vidId, title: newVideoTitle.trim() || `Vídeo ${currentVids.length + 1}` }];

        setGames({ ...games, [editingGameKey]: { ...editingGame, youtubeVideos: updatedVids } });
        setNewVideoTitle("");
        setNewVideoUrl("");
        showNotification("Vídeo anexado!");
      };

      const publishedGamesKeys = useMemo(() => {
        return Object.keys(games).filter(k => {
          const g = games[k];
          if (g.isPublished === false) return false;
          if (!playerSearchQuery) return true;
          return g.name.toLowerCase().includes(playerSearchQuery.toLowerCase()) || g.category.toLowerCase().includes(playerSearchQuery.toLowerCase());
        });
      }, [games, playerSearchQuery]);

        backgroundColor: appConfig.customCardBgColor,
        borderColor: appConfig.customBorderColor,
        color: appConfig.customTextColor

      const accentBgStyle = {
        backgroundColor: appConfig.customAccentColor

              <Icon name="sparkles" className="w-4 h-4 text-purple-400" />
              <span>{toastMsg}</span>
            </div>

          {/* MODAL CONFIRMAÇÃO DE DELEÇÃO */}

            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn">

                      delete copy[deleteModalGameKey];
                      setGames(copy);

                        setEditingGameKey(remaining[0]);

                      showNotification("Jogo removido!");

                    <ol className="space-y-2 text-xs text-slate-300 list-decimal pl-5">
                      <li>Crie um repositório no GitHub (ex: <code className="text-amber-300">meu-rulemaster</code>).</li>
                      <li>Suba este arquivo com o nome exato de <code className="text-amber-300">index.html</code> na raiz do repositório.</li>
                      <li>Vá em <strong>Settings &rarr; Pages</strong> no seu repositório.</li>
                      <li>Selecione a branch <strong>main</strong> e clique em <strong>Save</strong>.</li>
                      <li>Acesse o link público gerado pelo GitHub no seu celular!</li>
                    </ol>
                  </div>
                )}

              </div>
            )}
          </main>

          <footer className="border-t py-4 text-center text-xs text-slate-500 mt-auto" style={{ borderColor: appConfig.customBorderColor }}>
            {appConfig.footerText}
          </footer>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = createRoot(container);
    root.render(<App />);
  </script>

</body>
</html>
